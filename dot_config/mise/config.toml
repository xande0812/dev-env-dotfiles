# managed by chezmoi (dev-env-dotfiles)
# グローバル mise 設定。
# bump 時はこの version を上げ、diff レビューしてから apply する運用にする。
# short name 解決できない git-wt / sheldon は backend を明示
# (aqua はチェックサム検証あり、ubi は deprecated なので github: を使う)。
[tools]
node = "24.16.0"
ripgrep = "15.1.0"
fd = "10.4.2"
fzf = "0.73.1"
eza = "0.23.4"
starship = "1.25.1"
lazygit = "0.62.2"
neovim = "0.12.2"
uv = "0.11.19"
direnv = "2.37.1"
gh = "2.93.0"
ghq = "1.10.1"
dotenvx = "1.71.0"
ollama = "0.30.10"
"github:k1LoW/git-wt" = "0.29.0"
"aqua:rossmacarthur/sheldon" = "0.8.5"
# pnpm: bwrap の pnpm-sandboxed (install 系 sandbox) が使う。
pnpm = "11.5.1"
# AI agent CLI。bwrap wrapper (claude-sandboxed / codex-sandboxed 等) が
# `mise which` で実体パスを解決して sandbox 内で起動する。backend を aqua に
# 明示固定して公式 GitHub release の checksum 検証経路を担保する (短縮名 claude /
# codex は http:claude / npm fallback も持つため)。bump 時は version を上げ、
# upstream release を確認してから apply (flake.lock の rev+sha256 運用を踏襲)。
"aqua:anthropics/claude-code" = "2.1.185"
"aqua:openai/codex" = "0.135.0"
"aqua:vercel-labs/agent-browser" = "0.27.1"
# rtk (Rust Token Killer): dev コマンドを token 圧縮する CLI proxy。Claude Code の
# PreToolUse(Bash) hook (`rtk hook claude`, dot_claude/settings.json) が全 Bash を
# `rtk ...` に書き換える = agent の挙動に効く面なので、claude/codex 同様 aqua backend
# を明示固定して checksum 検証経路を担保する (短縮名 rtk は github fallback も持つ /
# PATH 上は reachingforthejack/rtk と名前衝突しうるため backend を曖昧にしない)。
"aqua:rtk-ai/rtk" = "0.42.3"
# rmux: Rust 製の tmux 互換 multiplexer (90+ tmux command 対応)。mise registry に
# short name 未登録なので github backend を明示 (Releases の prebuilt binary
# rmux-x.y.z-linux-x86_64.tar.gz を取得。ubi backend は deprecated)。cargo/rust
# toolchain 不要。bump 時は version を上げ upstream release を確認してから apply。
"github:helvesec/rmux" = "0.5.0"
# lazysql: Go 製のクロスプラットフォーム DB 管理 TUI。mise registry に short name
# 未登録なので github backend を明示 (Releases の prebuilt binary
# lazysql_Linux_x86_64.tar.gz を取得。ubi backend は deprecated)。go toolchain
# 不要。bump 時は version を上げ upstream release を確認してから apply。
"github:jorgerojas26/lazysql" = "0.5.4"

[settings]
# cd しただけで不足 tool を自動取得・ビルドしない（install は明示）。
not_found_auto_install = false
# .node-version / .python-version 等の暗黙読みを無効化。
idiomatic_version_file_enable_tools = []
# experimental 機能は off。
experimental = false
