# managed by chezmoi (dev-env-dotfiles)
# グローバル mise 設定。
# bump 時はこの version を上げ、diff レビューしてから apply する運用にする。
# short name 解決できない git-wt / sheldon は backend を明示
# (aqua はチェックサム検証あり、ubi は deprecated なので github: を使う)。
[tools]
node = "24.16.0"
ripgrep = "15.1.0"
fd = "10.4.2"
fzf = "0.73.1"
eza = "0.23.4"
starship = "1.25.1"
lazygit = "0.62.2"
neovim = "0.12.2"
uv = "0.11.19"
gh = "2.93.0"
ghq = "1.10.1"
dotenvx = "1.71.0"
"github:k1LoW/git-wt" = "0.29.0"
"aqua:rossmacarthur/sheldon" = "0.8.5"

[settings]
# cd しただけで不足 tool を自動取得・ビルドしない（install は明示）。
not_found_auto_install = false
# .node-version / .python-version 等の暗黙読みを無効化。
idiomatic_version_file_enable_tools = []
# experimental 機能は off。
experimental = false
